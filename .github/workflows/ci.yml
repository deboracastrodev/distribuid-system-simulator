name: CI

# Roda em todo push, em qualquer branch. PRs abertos a partir deste repositório
# recebem os checks do push do mesmo commit, por isso não há gatilho
# pull_request (ele duplicaria cada execução).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_db
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DSN: postgres://nexus_user:nexus_pass@localhost:5432/nexus_db?sslmode=disable
      # Sem POSTGRES_DSN os testes de integração seriam pulados e o job passaria
      # sem testar nada; com esta variável eles falham em vez de pular.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Testes (unitários + integração contra Postgres)
        run: go test -race -count=1 ./...

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Instalar dependências
        run: pip install ".[dev]"

      - name: pytest
        run: python -m pytest tests/ -v

  e2e:
    name: E2E + Chaos (docker compose)
    runs-on: ubuntu-latest
    needs: [server, agent]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Subir a stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Dependências dos scripts
        run: pip install docker psycopg2-binary confluent-kafka

      - name: E2E (50 planos)
        run: python scripts/e2e_demo.py --plans 50

      - name: Chaos (gaps, Redis restart, zombies, mensagens envenenadas)
        run: python scripts/chaos_test.py --orders 10

      - name: Logs da stack
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
